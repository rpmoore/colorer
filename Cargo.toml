[package]
name = "colorer"
version = "0.1.0"
edition = "2024"
description = "CLI to discover and control RGB-capable hardware on Linux via native device access"

[dependencies]
clap = { version = "4", features = ["derive"] }
# linux-native-basic-udev: pure-Rust sysfs-based enumeration, no libudev.so/
# pkg-config system dependency (the plan's default "linux-static-hidraw"
# backend needs libudev-dev, unavailable in the build environment). Also
# keeps "native device access, no external app" closer to the spec's intent.
hidapi = { version = "2", default-features = false, features = ["linux-native-basic-udev"] }

[dev-dependencies]
tempfile = "3"
